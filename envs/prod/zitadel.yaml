# zitadel prod — full HA; internal-only issuer until the E2 edge gate.
zitadel:
  configmapConfig:
    ExternalPort: 443
replicaCount: 3
pdb:
  enabled: true
  minAvailable: 2
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: zitadel
              app.kubernetes.io/instance: zitadel
          topologyKey: kubernetes.io/hostname
login:
  replicaCount: 3
  pdb:
    enabled: true
    minAvailable: 2
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: zitadel-login
                app.kubernetes.io/instance: zitadel
            topologyKey: kubernetes.io/hostname
