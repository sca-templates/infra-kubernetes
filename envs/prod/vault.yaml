# vault — prod profile (full HA: 3 replicas, real storage). `server.ha.replicas`
# matches the base default (3), declared explicitly for tier symmetry.

server:
  ha:
    replicas: 3

  dataStorage:
    size: 20Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
