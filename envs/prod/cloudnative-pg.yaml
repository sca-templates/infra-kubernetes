# cloudnative-pg — prod profile (2 replicas, soft anti-affinity, manual sync
# tier). Mirrors the qa scale/spread; the operator is not a stateful datastore,
# so prod stays on the same footprint as qa. The chart ships no
# PodDisruptionBudget value, so the tier expresses scale + spread only.

replicaCount: 2

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: topology.kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
