# velero — local overlay
#
# The local backup backend is Floci's S3 emulator, which accepts the fixed
# dummy credentials used by the cloud smoke. The bucket is provisioned by the
# `floci-buckets` PreSync Job in infrastructure/velero/manifests.
configuration:
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: velero
      config:
        region: us-east-1
        s3ForcePathStyle: "true"
        s3Url: http://floci.cloud.svc.cluster.local:4566
  # No CSI snapshot driver on the local k3s substrate.
  volumeSnapshotLocation: []

schedules:
  critical-namespaces:
    disabled: false
    schedule: "0 2 * * *"
    template:
      includedNamespaces:
        - data
        - vault
        - keycloak
        - kong
        - cert-manager
      ttl: 168h0m0s
      snapshotVolumes: false

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
