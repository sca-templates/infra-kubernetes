# kong — local profile (developer kind cluster: 1 replica, minimal resources).
# The proxy is exposed as NodePort: bootstrap/kind-config.yaml maps the kind node
# ports 30080 → host 80 (HTTP) and 30443 → host 443 (HTTPS), so `curl
# http://localhost/` and `curl -k https://localhost/` reach the gateway edge.

replicaCount: 1

proxy:
  type: NodePort
  http:
    nodePort: 30080
  tls:
    nodePort: 30443

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 384Mi
