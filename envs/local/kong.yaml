# kong — local profile (developer cluster: 1 replica, minimal resources).
# The proxy is exposed as NodePort 30080/30443 on the node; on the Floci EKS
# node, `make port-forward APP=kong-admin` (or a node port-forward) reaches the
# gateway edge from the host.

replicaCount: 1

proxy:
  type: NodePort
  http:
    nodePort: 30080
  tls:
    nodePort: 30443

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 384Mi
