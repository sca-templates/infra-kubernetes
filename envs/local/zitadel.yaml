# zitadel local — 1 replica and the high port used by the port-forward smoke.
zitadel:
  configmapConfig:
    ExternalPort: 8443
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
login:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
