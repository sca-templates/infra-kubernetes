# zitadel local — 1 replica; E1 keeps the canonical HTTPS issuer without an edge.
zitadel:
  configmapConfig:
    ExternalPort: 443
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
login:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
