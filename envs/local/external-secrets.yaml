# external-secrets — local profile (developer kind cluster: 1 replica, minimal
# resources). Matches the base defaults; declared explicitly for tier symmetry.

replicaCount: 1

certController:
  # Readiness off on the auto-sync tiers (local/dev, CI runner): the probe
  # gates on asynchronous CRD/webhook injection reconciles that can take
  # several minutes on a cold boot, which wedges ArgoCD's sync (no `-Async`)
  # until the Deployment is Healthy. The controller serves no traffic; the
  # component smoke asserts real readiness. qa/prod keep the probe.
  readinessProbe:
    enabled: false
