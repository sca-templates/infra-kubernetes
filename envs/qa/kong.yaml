# kong — qa profile (2 replicas, PodDisruptionBudget, soft anti-affinity).
# `preferred` anti-affinity keeps the overlay loadable on a single-node kind for
# promote-test while still spreading replicas in real HA. The chart ships a
# PodDisruptionBudget value that requires replicaCount > 1 (it fails the render
# otherwise), so the budget first becomes expressible here.

replicaCount: 2

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: topology.kubernetes.io/hostname
          labelSelector:
            # Subset of the pod template labels the chart renders (kong.metaLabels
            # + app.kubernetes.io/component: app); select on the same labels the
            # chart's own selectors use.
            matchLabels:
              app.kubernetes.io/name: kong
              app.kubernetes.io/instance: kong
              app.kubernetes.io/component: app

resources:
  requests:
    cpu: 200m
    memory: 384Mi
  limits:
    cpu: 1000m
    memory: 768Mi
