# external-secrets — qa profile (full HA: 3 replicas, PDB and soft
# anti-affinity). `preferred` anti-affinity keeps the overlay loadable on a
# single-node kind for promote-test while still spreading replicas in real HA.

replicaCount: 3
leaderElect: true

podDisruptionBudget:
  enabled: true
  minAvailable: 2

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: topology.kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: external-secrets

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

webhook:
  replicaCount: 3

certController:
  replicaCount: 3
