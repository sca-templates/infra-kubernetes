# kafka local — Strimzi Kafka cluster (Phase 11).
#
# KRaft mode: the KafkaNodePool below owns the controller+broker nodes, so
# there is no ZooKeeper. The internal listener is TLS + SCRAM-SHA-512; the
# password for the `scram-admin` user is projected from Vault by the sibling
# ExternalSecret and referenced by the KafkaUser.
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: kafka
  namespace: data
  annotations:
    # Required by Strimzi to reconcile Kafka through KafkaNodePool resources.
    strimzi.io/node-pools: enabled
    argocd.argoproj.io/sync-wave: "10"
spec:
  kafka:
    version: 4.2.0
    image: quay.io/strimzi/kafka:1.2.0-kafka-4.2.0
    listeners:
      - name: internal
        port: 9092
        type: internal
        tls: true
        authentication:
          type: scram-sha-512
    authorization:
      type: simple
      superUsers:
        - scram-admin
    config:
      default.replication.factor: 1
      min.insync.replicas: 1
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      # Topics are declared through KafkaTopic; the smoke creates its own.
      auto.create.topics.enable: false
  entityOperator:
    topicOperator: {}
    userOperator: {}
