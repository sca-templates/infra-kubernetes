# kafka local — SCRAM admin credentials projected from Vault (Phase 11).
#
# Vault is the source of truth for the password; the Strimzi User Operator
# consumes it through `KafkaUser.spec.authentication.password.valueFrom`, so
# the user is still managed declaratively without forking the operator.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kafka-scram-admin
  namespace: data
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: kafka-scram-admin
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: secret/kafka/local
        property: username
    - secretKey: password
      remoteRef:
        key: secret/kafka/local
        property: password
