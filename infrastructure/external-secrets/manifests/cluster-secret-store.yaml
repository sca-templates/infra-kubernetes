# ClusterSecretStore vault — the single bridge between ESO and Vault (Phase 3).
# Authenticates with the `external-secrets` kubernetes-auth role that
# bootstrap/seed-vault.sh provisions (Phase 2): SA `external-secrets` in
# namespace `external-secrets`, policy `external-secrets` (read secret/*).
#
# TLS: Vault only accepts HTTPS via the cert-manager-issued leaf `vault-tls`
# (sca-ca chain, infrastructure/vault/manifests/); the store trusts the same CA
# bundle through the Secret's ca.crt.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
  annotations:
    # Within the external-secrets Application (app-wide wave -10), apply after
    # the chart's CRDs/controller (default wave 0) AND after the vault
    # Application (app-wide wave 0), so the store only references an existing
    # Service. Vault being seeded is CI-time (`seed-vault.sh`, "wave 10"), so
    # the store turns Ready on its short refresh once the role exists.
    argocd.argoproj.io/sync-wave: "5"
spec:
  # Short refresh on every env (local rule): a store/path that appears late
  # (e.g. Vault still sealing on a fresh bootstrap) is picked up automatically
  # without manual ESO restarts.
  refreshInterval: 5m
  provider:
    vault:
      # vault-active follows the elected raft leader; the leaf certificate
      # covers its DNS name (vault-tls-certificate.yaml).
      server: "https://vault-active.vault.svc.cluster.local:8200"
      caProvider:
        type: Secret
        name: vault-tls
        key: ca.crt
        namespace: vault
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
