# keycloak db credentials qa — CNPG credentials projected from Vault.
#
# This is the same `secret/keycloak-db/qa` path the CNPG Cluster consumes in
# namespace `data`; Keycloak runs in its own namespace, so it needs its own
# projection of the same credentials.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-db-credentials
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: keycloak-db-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: secret/keycloak-db/qa
        property: username
    - secretKey: password
      remoteRef:
        key: secret/keycloak-db/qa
        property: password
