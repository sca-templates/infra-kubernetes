# linkerd-identity-trust-roots — the mTLS trust anchor, as the chart expects it.
#
# The linkerd-control-plane chart mounts this ConfigMap into the identity
# controller and every injected proxy (as `linkerd-identity-trust-roots`, key
# `ca-bundle.crt`) when `identity.externalCA=true`: the proxies trust only the
# certificate here, and the identity controller must present a certificate that
# chains to it. It holds the PUBLIC half of the trust anchor only — the matching
# key is in the `linkerd-identity-anchor` Secret, used solely by cert-manager to
# sign the issuer (`identity-issuer.yaml`).
#
# `ca-bundle.crt` may hold one or more PEM certificates (a bundle), which is why
# it is a ConfigMap rather than a single-file Secret. Here it carries just the
# root CA, CN=root.linkerd.cluster.local (valid to 2036-10-18).
apiVersion: v1
kind: ConfigMap
metadata:
  name: linkerd-identity-trust-roots
  namespace: linkerd
  annotations:
    # Needed by the chart's pods; created alongside the anchor (wave 10).
    argocd.argoproj.io/sync-wave: "10"
data:
  ca-bundle.crt: |
