# zitadel qa — chart secrets projected from Vault (ADR-004, E1).
#
# `zitadel-masterkey` is immutable after the first boot; never rotate it in
# place. `zitadel-login-session` supplies the Login UI cookie secret (v4.19.2+).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-masterkey
  namespace: zitadel
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: zitadel-masterkey
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: masterkey
      remoteRef:
        key: secret/zitadel/qa
        property: masterkey
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-db-credentials
  namespace: zitadel
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: zitadel-db-credentials
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: dsn
      remoteRef:
        key: secret/zitadel-db/qa
        property: dsn
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-login-session
  namespace: zitadel
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: zitadel-login-session
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: ZITADEL_SESSION_COOKIE_SECRET
      remoteRef:
        key: secret/zitadel/qa
        property: session_cookie_secret
