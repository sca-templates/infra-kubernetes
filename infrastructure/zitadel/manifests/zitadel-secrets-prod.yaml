# zitadel prod — chart master key projected from Vault (ADR-004, E1).
# It is immutable after the first boot; never rotate it in place.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-masterkey
  namespace: zitadel
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: zitadel-masterkey
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: masterkey
      remoteRef:
        key: secret/zitadel/prod
        property: masterkey
