apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zitadel-login
  namespace: zitadel
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  ingressClassName: kong
  tls:
    - hosts:
        - zitadel.local
      secretName: zitadel-tls
  rules:
    - host: zitadel.local
      http:
        paths:
          - path: /ui/v2/login
            pathType: Prefix
            backend:
              service:
                name: zitadel-login
                port:
                  number: 3000
