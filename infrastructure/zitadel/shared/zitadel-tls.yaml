apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: zitadel-tls
  namespace: zitadel
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  secretName: zitadel-tls
  issuerRef:
    name: sca-ca
    kind: ClusterIssuer
  commonName: zitadel.local
  dnsNames:
    - zitadel.local
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: RSA
    size: 2048
