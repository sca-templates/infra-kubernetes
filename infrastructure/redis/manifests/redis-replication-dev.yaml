# redis dev — RedisReplication (Phase 12).
#
# Single-instance Redis (no Sentinel). Password projected from Vault via ESO;
# AOF enabled through the PVC/entrypoint flow.
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisReplication
metadata:
  name: redis
  namespace: data
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  clusterSize: 1
  kubernetesConfig:
    image: quay.io/opstree/redis:v7.4.11
    imagePullPolicy: IfNotPresent
    redisSecret:
      name: redis-password
      key: password
  podSecurityContext:
    fsGroup: 1000
  storage:
    volumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
  redisExporter:
    enabled: true
    image: quay.io/opstree/redis-exporter:v1.44.0
    imagePullPolicy: IfNotPresent
