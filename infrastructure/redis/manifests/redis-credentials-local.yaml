# redis local — Redis password projected from Vault (Phase 12).
#
# Vault is the source of truth for the password; the OT Container Kit Redis
# operator consumes it through `spec.kubernetesConfig.redisSecret` on the
# RedisReplication CR and uses it for `requirepass` (and as the master/sentinel
# auth fallback where applicable).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-password
  namespace: data
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: redis-password
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: secret/redis/local
        property: password
