apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vault-snapshot-minio
  namespace: vault
  annotations:
    # Same (final) wave as the chart: the secret cannot exist until Vault is
    # seeded, so an intermediate wave would deadlock the sync.
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: vault-snapshot-minio
    creationPolicy: Owner
  data:
    - secretKey: access_key
      remoteRef:
        key: secret/velero/credentials
        property: access_key
    - secretKey: secret_key
      remoteRef:
        key: secret/velero/credentials
        property: secret_key
