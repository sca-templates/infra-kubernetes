apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-snapshot
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-raft-snapshot
  namespace: vault
  annotations:
    # Same (final) wave as the chart; the CronJob itself does not need Vault to
    # be unsealed, but a later wave would make the chart's StatefulSet
    # intermediate and health-gate the sync while Vault is sealed.
    argocd.argoproj.io/sync-wave: "0"
spec:
  schedule: "0 */6 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: vault-raft-snapshot
        spec:
          automountServiceAccountToken: false
          serviceAccountName: vault-snapshot
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: snapshot
              image: amazon/aws-cli:2.27.63
              imagePullPolicy: Always
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  export VAULT_ADDR=http://vault.vault.svc.cluster.local:8200
                  if [ -f /vault/secrets/root-token ]; then
                    export VAULT_TOKEN=$(cat /vault/secrets/root-token)
                  fi
                  export AWS_ACCESS_KEY_ID=$(cat /minio-creds/access_key)
                  export AWS_SECRET_ACCESS_KEY=$(cat /minio-creds/secret_key)
                  export AWS_DEFAULT_REGION=minio
                  aws --endpoint-url=http://minio.minio.svc.cluster.local:9000 s3 mb s3://vault-snapshots 2>/dev/null || true
                  aws --endpoint-url=http://minio.minio.svc.cluster.local:9000 s3 ls s3://vault-snapshots/ >/dev/null 2>&1 || true
              volumeMounts:
                - name: minio-creds
                  mountPath: /minio-creds
                  readOnly: true
                - name: vault-root-token
                  mountPath: /vault/secrets
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                - name: aws
                  mountPath: /.aws
          volumes:
            - name: minio-creds
              secret:
                secretName: vault-snapshot-minio
            - name: vault-root-token
              secret:
                secretName: vault-unseal-keys
                optional: true
            - name: tmp
              emptyDir: {}
            - name: aws
              emptyDir: {}
