apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-raft-snapshot
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  schedule: "0 */6 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: vault
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: snapshot
              image: amazon/aws-cli:2.27.63
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                runAsNonRoot: true
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  export VAULT_ADDR=http://vault.vault.svc.cluster.local:8200
                  if [ -f /vault/secrets/root-token ]; then
                    export VAULT_TOKEN=$(cat /vault/secrets/root-token)
                  fi
                  # Use vault from a side approach - install or use existing
                  yum install -y -q vault 2>/dev/null || apk add --no-cache vault 2>/dev/null || true
                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  vault operator raft snapshot save /tmp/vault-snapshot-${TIMESTAMP}.snap || true
                  export AWS_ACCESS_KEY_ID=$(cat /minio-creds/access_key)
                  export AWS_SECRET_ACCESS_KEY=$(cat /minio-creds/secret_key)
                  aws --endpoint-url=http://minio.minio.svc.cluster.local:9000 s3 mb s3://vault-snapshots 2>/dev/null || true
                  aws --endpoint-url=http://minio.minio.svc.cluster.local:9000 s3 cp \
                    /tmp/vault-snapshot-${TIMESTAMP}.snap \
                    s3://vault-snapshots/ || true
              volumeMounts:
                - name: minio-creds
                  mountPath: /minio-creds
                  readOnly: true
                - name: vault-root-token
                  mountPath: /vault/secrets
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: minio-creds
              secret:
                secretName: vault-snapshot-minio
            - name: vault-root-token
              secret:
                secretName: vault-unseal-keys
                optional: true
            - name: tmp
              emptyDir: {}
