apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-raft-snapshot
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  schedule: "0 */6 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: vault
          restartPolicy: OnFailure
          containers:
            - name: snapshot
              image: hashicorp/vault:1.20.4
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  export VAULT_ADDR=http://vault.vault.svc.cluster.local:8200
                  # Get root token or use auth
                  if [ -f /vault/secrets/root-token ]; then
                    export VAULT_TOKEN=$(cat /vault/secrets/root-token)
                  fi
                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  vault operator raft snapshot save /tmp/vault-snapshot-${TIMESTAMP}.snap
                  # Upload to S3/MinIO
                  apk add --no-cache aws-cli || true
                  export AWS_ACCESS_KEY_ID=$(cat /minio-creds/access_key)
                  export AWS_SECRET_ACCESS_KEY=$(cat /minio-creds/secret_key)
                  aws --endpoint-url=http://minio.minio.svc.cluster.local:9000 s3 cp \
                    /tmp/vault-snapshot-${TIMESTAMP}.snap \
                    s3://vault-snapshots/ || true
              volumeMounts:
                - name: minio-creds
                  mountPath: /minio-creds
                  readOnly: true
                - name: vault-root-token
                  mountPath: /vault/secrets
                  readOnly: true
          volumes:
            - name: minio-creds
              secret:
                secretName: vault-snapshot-minio
            - name: vault-root-token
              secret:
                secretName: vault-unseal-keys
                optional: true
