# Vault raft snapshot S3 credentials — local.
#
# ExternalSecret projects the object-store credentials from Vault
# (`secret/vault-snapshot/local`) into the `vault-snapshot-credentials` Secret
# consumed by the CronJob upload container.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vault-snapshot-credentials
  namespace: vault
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: vault-snapshot-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        cloud: |
          [default]
          aws_access_key_id={{ .access_key }}
          aws_secret_access_key={{ .secret_key }}
        AWS_DEFAULT_REGION: "{{ .region }}"
  data:
    - secretKey: access_key
      remoteRef:
        key: secret/vault-snapshot/local
        property: access_key
    - secretKey: secret_key
      remoteRef:
        key: secret/vault-snapshot/local
        property: secret_key
    - secretKey: region
      remoteRef:
        key: secret/vault-snapshot/local
        property: region
