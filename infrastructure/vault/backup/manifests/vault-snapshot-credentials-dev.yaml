# Vault raft snapshot S3 credentials — dev.
#
# ExternalSecret projects the object-store credentials from Vault
# (`secret/vault-snapshot/dev`) into the `vault-snapshot-credentials` Secret
# consumed by the CronJob upload container.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vault-snapshot-credentials
  namespace: vault
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: vault-snapshot-credentials
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: secret/vault-snapshot/dev
        property: access_key
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: secret/vault-snapshot/dev
        property: secret_key
    - secretKey: AWS_DEFAULT_REGION
      remoteRef:
        key: secret/vault-snapshot/dev
        property: region
