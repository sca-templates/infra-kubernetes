# Vault raft snapshot CronJob — prod.
#
# The init container authenticates with the `vault-snapshot` Kubernetes-auth
# role, saves a raft snapshot to a shared emptyDir, and validates its integrity
# with `vault operator raft snapshot inspect`. The upload container copies it to
# object storage and expires snapshots older than the environment retention.
# Restoring a raft snapshot is a full-cluster operation and remains a documented
# manual runbook (see docs/backups.md).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-raft-snapshot
  namespace: vault
  labels:
    app.kubernetes.io/name: vault-raft-snapshot
    app.kubernetes.io/part-of: vault
spec:
  schedule: "30 1 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: vault-raft-snapshot
            app.kubernetes.io/part-of: vault
        spec:
          serviceAccountName: vault-snapshot
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 100
            fsGroup: 100
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: snapshot
              image: hashicorp/vault:2.0.4
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-ec"]
              env:
                - name: VAULT_ADDR
                  value: https://vault-active.vault.svc.cluster.local:8200
                - name: VAULT_CACERT
                  value: /vault/tls/ca.crt
                - name: HOME
                  value: /work
                - name: TMPDIR
                  value: /work/tmp
              args:
                - |
                  set -eu
                  mkdir -p "${TMPDIR}"
                  jwt="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
                  VAULT_TOKEN="$(vault write -field=token auth/kubernetes/login role=vault-snapshot jwt="${jwt}")"
                  export VAULT_TOKEN
                  vault operator raft snapshot save /work/vault.snap
                  vault operator raft snapshot inspect -details=true -depth 3 /work/vault.snap >/dev/null
                  echo "VAULT_SNAPSHOT_OK bytes=$(wc -c < /work/vault.snap)"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: vault-tls
                  mountPath: /vault/tls
                  readOnly: true
          containers:
            - name: upload
              image: amazon/aws-cli:2.38.1@sha256:733d5be1015825e4038c6016f3fa9954868ddee1f611b73be795a9cc2e706bfd
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/scripts/upload.sh"]
              env:
                - name: HOME
                  value: /work
                - name: TMPDIR
                  value: /work/tmp
                - name: AWS_EC2_METADATA_DISABLED
                  value: "true"
                - name: AWS_PAGER
                  value: ""
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: vault-snapshot-credentials
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: vault-snapshot-credentials
                      key: AWS_SECRET_ACCESS_KEY
                - name: AWS_DEFAULT_REGION
                  valueFrom:
                    secretKeyRef:
                      name: vault-snapshot-credentials
                      key: AWS_DEFAULT_REGION
                - name: S3_BUCKET
                  value: sca-prod-vault-snapshots
                - name: S3_PREFIX
                  value: raft
                - name: S3_RETENTION_DAYS
                  value: "90"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: work
              emptyDir: {}
            - name: script
              configMap:
                name: vault-snapshot-script
                defaultMode: 0555
            - name: vault-tls
              secret:
                secretName: vault-tls
