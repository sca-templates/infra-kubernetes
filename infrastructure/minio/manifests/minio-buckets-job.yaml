# minio-buckets — create the buckets the platform backs up into.
#
# This is deliberately NOT the chart's `buckets` value: that renders a Helm
# post-install/post-upgrade hook, which Argo CD maps to a PostSync hook. The
# hook would block the MinIO sync until the root secret exists, but Vault is
# seeded only after every Application is Synced, so it deadlocks.
#
# A normal Job in the same (final) wave stays Pending while the secret is
# missing, starts after the Vault seed, and is then health-gated. It is
# idempotent: `head-bucket` skips buckets that already exist.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-buckets
  namespace: minio
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: minio-buckets
    app.kubernetes.io/part-of: sca-platform
spec:
  backoffLimit: 12
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-buckets
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: aws
          image: amazon/aws-cli:2.38.1@sha256:733d5be1015825e4038c6016f3fa9954868ddee1f611b73be795a9cc2e706bfd
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          env:
            - name: HOME
              value: /tmp
            - name: AWS_DEFAULT_REGION
              value: minio
            - name: AWS_ENDPOINT_URL
              value: http://minio.minio.svc.cluster.local:9000
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-root-credentials
                  key: rootUser
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-root-credentials
                  key: rootPassword
          args:
            - |
              set -eu
              mkdir -p "${HOME}/.aws"
              printf '[default]\nregion = minio\ns3 =\n  addressing_style = path\n' > "${HOME}/.aws/config"
              for bucket in velero vault-snapshots cnpg-backups; do
                if aws --endpoint-url "${AWS_ENDPOINT_URL}" s3api head-bucket --bucket "${bucket}" >/dev/null 2>&1; then
                  echo "bucket ${bucket}: present"
                else
                  echo "bucket ${bucket}: creating"
                  aws --endpoint-url "${AWS_ENDPOINT_URL}" s3api create-bucket --bucket "${bucket}"
                fi
              done
              aws --endpoint-url "${AWS_ENDPOINT_URL}" s3api list-buckets --query 'Buckets[].Name' --output text
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
