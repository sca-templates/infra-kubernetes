apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-root-credentials
  namespace: minio
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: minio-root-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        rootUser: "{{ .username | toString }}"
        rootPassword: "{{ .password | toString }}"
  data:
    - secretKey: username
      remoteRef:
        key: secret/minio/root
        property: username
    - secretKey: password
      remoteRef:
        key: secret/minio/root
        property: password
