# velero — base values
# Official chart: vmware-tanzu/velero
# Chart pin (targetRevision) is set in argocd/apps-<env>.yaml
#
# This file is the cloud-neutral baseline. The local overlay points the backup
# storage location at the Floci S3 emulator; dev/qa/prod overlays select their
# own bucket and, when the cluster has a CSI snapshot driver, keep the AWS
# volume snapshot location enabled.

image:
  repository: velero/velero
  tag: v1.16.1
  pullPolicy: IfNotPresent

initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.11.1
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins

# Configuration
configuration:
  backupStorageLocation:
    - name: default
      provider: aws
      # Every environment overlay sets its own bucket. This fallback keeps the
      # base renderable without silently pointing at a real account.
      bucket: sca-velero
      config:
        region: us-east-1
  # EBS CSI snapshots are only available on AWS-backed clusters. The local
  # overlay clears this list; see envs/local/velero.yaml.
  volumeSnapshotLocation:
    - name: default
      provider: aws
      config:
        region: us-east-1
  defaultVolumesToFsBackup: false

credentials:
  useSecret: true
  existingSecret: velero-credentials

# Deploy node agent for filesystem backups if needed
deployNodeAgent: false

# Schedules for critical namespaces. PV data is covered by the datastore-native
# backups (CNPG + Vault raft snapshots); Velero backs up the Kubernetes objects
# and, where a CSI driver exists, the volumes.
schedules:
  critical-namespaces:
    disabled: false
    schedule: "0 2 * * *"
    template:
      includedNamespaces:
        - data
        - vault
        - keycloak
        - kong
        - cert-manager
      ttl: 720h0m0s
      snapshotVolumes: true

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Service account
serviceAccount:
  server:
    create: true
    name: velero

# Disable upgradeCRDs job to avoid bitnamilegacy/kubectl dependency issues
upgradeCRDs: false

kubectl:
  image:
    repository: registry.k8s.io/kubectl
    tag: v1.33.4
