# postgres-app qa — CloudNativePG Cluster (Phase 10).
# Credentials are projected by the sibling ExternalSecret from
# `secret/postgres-app/qa`; see `postgres-app-credentials-qa.yaml`.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-app
  namespace: data
  annotations:
    # After the ExternalSecret (wave 0) that creates the bootstrap credentials.
    argocd.argoproj.io/sync-wave: "10"
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie
  backup:
    # Prefer a standby for base backups when the cluster has one; a single
    # instance falls back to the primary. WAL archiving is always from the
    # primary.
    target: prefer-standby
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://sca-qa-cnpg/postgres-app
      s3Credentials:
        accessKeyId:
          name: cnpg-backup-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-backup-credentials
          key: ACCESS_SECRET_KEY
        region:
          name: cnpg-backup-credentials
          key: AWS_REGION
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip
  bootstrap:
    initdb:
      database: app
      owner: app
      secret:
        name: postgres-app-credentials
      dataChecksums: true
      encoding: UTF8
      localeCollate: C
      localeCType: C
      # Runs as the superuser in the application database after initdb.
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;
  postgresql:
    parameters:
      # Logical decoding is the CDC foundation for downstream consumers.
      wal_level: logical
      # CNPG auto-manages shared_preload_libraries for pg_stat_statements as
      # soon as a `pg_stat_statements.*` parameter is present; setting the
      # library directly is rejected as a fixed parameter.
      pg_stat_statements.track: all
  storage:
    size: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  affinity:
    # HA: spread instances, but `preferred` keeps the overlay schedulable on a
    # single-node cluster (the promote-test substrate). A hard rule would leave
    # two of three instances Pending there.
    enablePodAntiAffinity: true
    podAntiAffinityType: preferred
    topologyKey: kubernetes.io/hostname
