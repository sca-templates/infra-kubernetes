apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-s3-credentials
  namespace: data
  annotations:
    # Same (final) wave as the Clusters: the secret is only needed once Vault
    # is seeded, and an intermediate wave would be health-gated while sealed.
    argocd.argoproj.io/sync-wave: "10"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: cnpg-s3-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        ACCESS_KEY_ID: "{{ .access_key | toString }}"
        ACCESS_SECRET_KEY: "{{ .secret_key | toString }}"
  data:
    - secretKey: access_key
      remoteRef:
        key: secret/minio/root
        property: username
    - secretKey: secret_key
      remoteRef:
        key: secret/minio/root
        property: password
