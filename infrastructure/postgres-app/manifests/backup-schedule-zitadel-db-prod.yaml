# Scheduled CNPG base backup for zitadel-db — prod.
#
# CloudNativePG uses a six-field cron expression (seconds first). The schedule
# is staggered from postgres-app to avoid overlapping S3 writes.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: zitadel-db-daily
  namespace: data
  annotations:
    argocd.argoproj.io/sync-wave: "40"
spec:
  schedule: "0 15 2 * * *"
  backupOwnerReference: cluster
  immediate: false
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: zitadel-db
