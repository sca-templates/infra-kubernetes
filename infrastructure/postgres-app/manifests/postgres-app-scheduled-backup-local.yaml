apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-app-scheduled
  namespace: data
  annotations:
    # Same (final) wave as the Cluster: no health gate while Vault is sealed.
    argocd.argoproj.io/sync-wave: "10"
spec:
  # CNPG cron format is six fields (seconds included).
  schedule: "0 0 3 * * *"
  backupOwnerReference: self
  cluster:
    name: postgres-app
  method: barmanObjectStore
