apiVersion: v1
kind: List
items:
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: zitadel-db-app-migrator
      namespace: data
      annotations:
        argocd.argoproj.io/sync-wave: "10"
    spec:
      refreshInterval: 5m
      secretStoreRef:
        name: vault
        kind: ClusterSecretStore
      target:
        name: zitadel-db-app-migrator
        creationPolicy: Owner
        template:
          type: kubernetes.io/basic-auth
          metadata:
            labels:
              cnpg.io/reload: "true"
      data:
        - secretKey: username
          remoteRef:
            key: secret/zitadel-db/local/roles/app_migrator
            property: username
        - secretKey: password
          remoteRef:
            key: secret/zitadel-db/local/roles/app_migrator
            property: password
  - apiVersion: external-secrets.io/v1
