# keycloak-db qa — credentials projected from Vault (Phase 10).
#
# Keycloak (Phase 13) consumes this database instead of its in-cluster H2. The
# projected Secret is a `kubernetes.io/basic-auth` Secret; CNPG requires its
# `username` to match the `bootstrap.initdb.owner` in the sibling Cluster.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-db-credentials
  namespace: data
  annotations:
    # Within the postgres-app Application (app-wide wave 40), project the
    # credentials before the Cluster (wave 10) is reconciled.
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: keycloak-db-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: secret/keycloak-db/qa
        property: username
    - secretKey: password
      remoteRef:
        key: secret/keycloak-db/qa
        property: password
