# keycloak-db local — credentials projected from Vault (Phase 10).
#
# Keycloak (Phase 13) consumes this database instead of its in-cluster H2. The
# projected Secret is a `kubernetes.io/basic-auth` Secret; CNPG requires its
# `username` to match the `bootstrap.initdb.owner` in the sibling Cluster.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-db-credentials
  namespace: data
  annotations:
    # Same (final) wave as the Cluster: the external secret cannot be healthy
    # while Vault is sealed, so it must not be an intermediate wave.
    argocd.argoproj.io/sync-wave: "10"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: keycloak-db-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: secret/keycloak-db/local
        property: username
    - secretKey: password
      remoteRef:
        key: secret/keycloak-db/local
        property: password
