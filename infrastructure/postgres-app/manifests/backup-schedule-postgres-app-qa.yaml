# Scheduled CNPG base backups — qa.
#
# CloudNativePG uses a six-field cron expression (seconds first). The schedules
# follow the Clusters (wave 20) after the Vault-dependent credentials wave.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-app-daily
  namespace: data
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  schedule: "0 30 1 * * *"
  backupOwnerReference: cluster
  immediate: false
  cluster:
    name: postgres-app
