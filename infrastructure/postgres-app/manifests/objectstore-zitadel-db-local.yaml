apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: zitadel-db-local
  namespace: data
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  retentionPolicy: "7d"
  configuration:
    destinationPath: s3://cnpg-backups/zitadel-db
    endpointURL: http://floci.cloud.svc.cluster.local:4566
    s3Credentials:
      accessKeyId:
        name: cnpg-backup-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-backup-credentials
        key: ACCESS_SECRET_KEY
      region:
        name: cnpg-backup-credentials
        key: AWS_REGION
    wal:
      compression: gzip
      maxParallel: 2
    data:
      compression: gzip
  instanceSidecarConfiguration:
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 50m
        memory: 64Mi
