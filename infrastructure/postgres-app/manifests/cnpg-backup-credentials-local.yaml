# cnpg-backup-credentials local — object-store credentials for CNPG backups.
#
# Both ObjectStores reference this Secret through
# `spec.configuration.s3Credentials`. The values come from Vault KV
# `secret/cnpg/local`; each environment has its own Vault and bucket.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-backup-credentials
  namespace: data
  annotations:
    # Project credentials before the ObjectStores (wave 20) and Clusters (wave 30).
    argocd.argoproj.io/sync-wave: "10"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: cnpg-backup-credentials
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: secret/cnpg/local
        property: access_key
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: secret/cnpg/local
        property: secret_key
    - secretKey: AWS_REGION
      remoteRef:
        key: secret/cnpg/local
        property: region
