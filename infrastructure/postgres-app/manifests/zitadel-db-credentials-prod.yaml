# zitadel-db prod — credentials projected from Vault (ADR-004, E1).
#
# The projected Secret is `kubernetes.io/basic-auth`; CNPG requires its
# `username` to match `bootstrap.initdb.owner` in the sibling Cluster.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-db-credentials
  namespace: data
  annotations:
    # Project credentials before the Cluster (wave 20) is reconciled.
    argocd.argoproj.io/sync-wave: "10"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: zitadel-db-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: secret/zitadel-db/prod
        property: username
    - secretKey: password
      remoteRef:
        key: secret/zitadel-db/prod
        property: password
