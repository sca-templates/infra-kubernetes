apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: zitadel-db-prod
  namespace: data
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  retentionPolicy: "90d"
  configuration:
    destinationPath: s3://sca-prod-cnpg/zitadel-db
    s3Credentials:
      accessKeyId:
        name: cnpg-backup-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-backup-credentials
        key: ACCESS_SECRET_KEY
      region:
        name: cnpg-backup-credentials
        key: AWS_REGION
    wal:
      compression: gzip
      maxParallel: 2
    data:
      compression: gzip
  instanceSidecarConfiguration:
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 250m
        memory: 256Mi
