# cnpg-backup-credentials dev — object-store credentials for CNPG backups.
#
# Both CNPG Clusters reference this Secret through
# `spec.backup.barmanObjectStore.s3Credentials`. The values come from Vault KV
# `secret/cnpg/dev`; each environment has its own Vault and bucket.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-backup-credentials
  namespace: data
  annotations:
    # Same wave as the Clusters: this secret is Vault-dependent, so it must not
    # introduce an intermediate health gate before Vault is seeded.
    argocd.argoproj.io/sync-wave: "10"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: cnpg-backup-credentials
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: secret/cnpg/dev
        property: access_key
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: secret/cnpg/dev
        property: secret_key
    - secretKey: AWS_REGION
      remoteRef:
        key: secret/cnpg/dev
        property: region
