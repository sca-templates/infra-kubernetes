# keycloak-db local — CloudNativePG Cluster (Phase 10).
# Credentials are projected by the sibling ExternalSecret from
# `secret/keycloak-db/local`; see `keycloak-db-credentials-local.yaml`.
#
# Keycloak (Phase 13) connects here instead of its in-cluster H2. Database and
# owner are both `keycloak`, matching the Keycloak chart's DB contract.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-db
  namespace: data
  annotations:
    # After the ExternalSecret (wave 0) that creates the bootstrap credentials.
    argocd.argoproj.io/sync-wave: "10"
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
      secret:
        name: keycloak-db-credentials
      dataChecksums: true
      encoding: UTF8
      localeCollate: C
      localeCType: C
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  affinity:
    # Single-node local profile: never block scheduling on anti-affinity.
    enablePodAntiAffinity: false
