# keycloak-db local — CloudNativePG Cluster (Phase 10).
# Credentials are projected by the sibling ExternalSecret from
# `secret/keycloak-db/local`; see `keycloak-db-credentials-local.yaml`.
#
# Keycloak (Phase 13) connects here instead of its in-cluster H2. Database and
# owner are both `keycloak`, matching the Keycloak chart's DB contract.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-db
  namespace: data
  annotations:
    # After the ExternalSecret (wave 0) that creates the bootstrap credentials.
    argocd.argoproj.io/sync-wave: "10"
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie
  backup:
    # Prefer a standby for base backups when the cluster has one; a single
    # instance falls back to the primary. WAL archiving is always from the
    # primary.
    target: prefer-standby
    barmanObjectStore:
      destinationPath: s3://cnpg-backups/keycloak-db
      endpointURL: http://floci.cloud.svc.cluster.local:4566
      s3Credentials:
        accessKeyId:
          name: cnpg-backup-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-backup-credentials
          key: ACCESS_SECRET_KEY
        region:
          name: cnpg-backup-credentials
          key: AWS_REGION
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip
      retentionPolicy: "7d"
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
      secret:
        name: keycloak-db-credentials
      dataChecksums: true
      encoding: UTF8
      localeCollate: C
      localeCType: C
  postgresql:
    parameters:
      # Bound the WAL archive lag for the restore smoke (see postgres-app).
      archive_timeout: "60s"
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  affinity:
    # Single-node local profile: never block scheduling on anti-affinity.
    enablePodAntiAffinity: false
