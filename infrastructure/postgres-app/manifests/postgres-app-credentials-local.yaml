# postgres-app — local application database (CloudNativePG, Phase 10).
#
# The primary relational store for the platform, not a local-only demo: the
# same Cluster CR ships in every environment with the tier profile in the file
# suffix. CloudNativePG (wave -10) reconciles it in `data` at wave 40.
#
# Credentials come from Vault KV `secret/postgres-app/<env>` through ESO. The
# projected Secret is a `kubernetes.io/basic-auth` Secret, which is what CNPG
# requires for `bootstrap.initdb.secret`; the `username` field must equal the
# `owner` below.
#
# Image: PostgreSQL 18.4, CNPG `standard` flavor (includes pgvector). The
# `system` flavor is deprecated upstream and `minimal` omits pgvector.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-app-credentials
  namespace: data
  annotations:
    # Same (final) wave as the Cluster: the external secret cannot be healthy
    # while Vault is sealed, so it must not be an intermediate wave.
    argocd.argoproj.io/sync-wave: "10"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: postgres-app-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: secret/postgres-app/local
        property: username
    - secretKey: password
      remoteRef:
        key: secret/postgres-app/local
        property: password
