apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: postgres-app-qa
  namespace: data
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  retentionPolicy: "30d"
  configuration:
    destinationPath: s3://sca-qa-cnpg/postgres-app
    s3Credentials:
      accessKeyId:
        name: cnpg-backup-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-backup-credentials
        key: ACCESS_SECRET_KEY
      region:
        name: cnpg-backup-credentials
        key: AWS_REGION
    wal:
      compression: gzip
      maxParallel: 2
    data:
      compression: gzip
  instanceSidecarConfiguration:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 100m
        memory: 256Mi
