# postgres-app local — CloudNativePG Cluster (Phase 10).
# Credentials are projected by the sibling ExternalSecret from
# `secret/postgres-app/local`; see `postgres-app-credentials-local.yaml`.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-app
  namespace: data
  annotations:
    # After the ExternalSecret (wave 0) that creates the bootstrap credentials.
    argocd.argoproj.io/sync-wave: "10"
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie
  backup:
    # Prefer a standby for base backups when the cluster has one; a single
    # instance falls back to the primary. WAL archiving is always from the
    # primary.
    target: prefer-standby
    barmanObjectStore:
      destinationPath: s3://cnpg-backups/postgres-app
      endpointURL: http://floci.cloud.svc.cluster.local:4566
      s3Credentials:
        accessKeyId:
          name: cnpg-backup-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-backup-credentials
          key: ACCESS_SECRET_KEY
        region:
          name: cnpg-backup-credentials
          key: AWS_REGION
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip
      retentionPolicy: "7d"
  bootstrap:
    initdb:
      database: app
      owner: app
      secret:
        name: postgres-app-credentials
      dataChecksums: true
      encoding: UTF8
      localeCollate: C
      localeCType: C
      # Runs as the superuser in the application database after initdb.
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;
  postgresql:
    parameters:
      # Logical decoding is the CDC foundation for downstream consumers.
      wal_level: logical
      # CNPG auto-manages shared_preload_libraries for pg_stat_statements as
      # soon as a `pg_stat_statements.*` parameter is present; setting the
      # library directly is rejected as a fixed parameter.
      pg_stat_statements.track: all
      # Bound the WAL archive lag; the backup smoke waits for the WAL segment
      # that contains its marker to reach object storage before running PITR.
      archive_timeout: "60s"
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  affinity:
    # Single-node local profile: never block scheduling on anti-affinity.
    enablePodAntiAffinity: false
