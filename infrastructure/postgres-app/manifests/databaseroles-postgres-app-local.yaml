        name: postgres-app
      name: app_rw
      login: true
      superuser: false
      createdb: false
      createrole: false
      replication: false
      bypassrls: false
      inherit: true
      databaseRoleReclaimPolicy: retain
      passwordSecret:
        name: postgres-app-app-rw
  - apiVersion: postgresql.cnpg.io/v1
    kind: DatabaseRole
    metadata:
      name: postgres-app-app-ro
      namespace: data
      annotations:
        argocd.argoproj.io/sync-options: Prune=false,Delete=false
        argocd.argoproj.io/sync-wave: "30"
