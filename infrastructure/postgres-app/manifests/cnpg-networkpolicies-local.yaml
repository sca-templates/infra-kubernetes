apiVersion: v1
kind: List
items:
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: cnpg-data-ingress
      namespace: data
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      podSelector:
        matchExpressions:
          - key: cnpg.io/cluster
            operator: Exists
      policyTypes:
        - Ingress
      ingress:
        - from:
            - namespaceSelector:
                matchExpressions:
                  - key: kubernetes.io/metadata.name
                    operator: Exists
                  - key: db-access
                    operator: In
                    values:
                      - "true"
          ports:
            - protocol: TCP
              port: 5432
        - from:
            - podSelector:
                matchExpressions:
                  - key: cnpg.io/cluster
                    operator: Exists
          ports:
            - protocol: TCP
              port: 5432
        - from:
            - podSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - role-bootstrap-postgres-app-local
                      - role-bootstrap-zitadel-db-local
          ports:
            - protocol: TCP
              port: 5432
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: cloudnative-pg
          ports:
            - protocol: TCP
              port: 8000
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: observability
          ports:
            - protocol: TCP
              port: 9187
        - from:
            - podSelector:
                matchExpressions:
                  - key: cnpg.io/cluster
                    operator: In
                    values:
                      - postgres-app-pooler
                      - zitadel-db-pooler
          ports:
            - protocol: TCP
              port: 5432
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: cnpg-data-egress
      namespace: data
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      podSelector:
        matchExpressions:
          - key: cnpg.io/cluster
            operator: Exists
      policyTypes:
        - Egress
      egress:
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: kube-system
              podSelector:
                matchLabels:
                  k8s-app: kube-dns
          ports:
            - protocol: UDP
              port: 53
            - protocol: TCP
              port: 53
        - to:
            - ipBlock:
                cidr: 0.0.0.0/0
          ports:
            - protocol: TCP
              port: 443
        - to:
            - ipBlock:
                cidr: 172.16.0.0/12
          ports:
            - protocol: TCP
              port: 6443
        - to:
            - podSelector:
                matchExpressions:
                  - key: cnpg.io/cluster
                    operator: Exists
          ports:
            - protocol: TCP
              port: 5432
        - to:
            - ipBlock:
                cidr: 0.0.0.0/0
          ports:
            - protocol: TCP
              port: 4566
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: cnpg-pooler-ingress
      namespace: data
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      podSelector:
        matchExpressions:
          - key: cnpg.io/cluster
            operator: In
            values:
              - postgres-app-pooler
              - zitadel-db-pooler
      policyTypes:
        - Ingress
      ingress:
        - from:
            - namespaceSelector:
                matchExpressions:
                  - key: kubernetes.io/metadata.name
                    operator: Exists
                  - key: db-access
                    operator: In
                    values:
                      - "true"
          ports:
            - protocol: TCP
              port: 5432
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: cnpg-pooler-egress
      namespace: data
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      podSelector:
        matchExpressions:
          - key: cnpg.io/cluster
            operator: In
            values:
              - postgres-app-pooler
              - zitadel-db-pooler
      policyTypes:
        - Egress
      egress:
        - to:
            - podSelector:
                matchExpressions:
                  - key: cnpg.io/cluster
                    operator: Exists
          ports:
            - protocol: TCP
              port: 5432
