# zitadel-db qa — CloudNativePG Cluster (ADR-004, E1).
# Credentials are projected by the sibling ExternalSecret from
# `secret/zitadel-db/qa`; see `zitadel-db-credentials-qa.yaml`.
#
# Zitadel connects here with a DSN from the same Vault path. Database and owner
# are both `zitadel`, matching the chart's DSN contract.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: zitadel-db
  namespace: data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    # After the ExternalSecret (wave 10) that creates the bootstrap credentials.
    argocd.argoproj.io/sync-wave: "20"
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie
  backup:
    target: prefer-standby
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://sca-qa-cnpg/zitadel-db
      s3Credentials:
        accessKeyId:
          name: cnpg-backup-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-backup-credentials
          key: ACCESS_SECRET_KEY
        region:
          name: cnpg-backup-credentials
          key: AWS_REGION
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip
  bootstrap:
    initdb:
      database: zitadel
      owner: zitadel
      secret:
        name: zitadel-db-credentials
      dataChecksums: true
      encoding: UTF8
      localeCollate: C
      localeCType: C
  postgresql:
    parameters:
      # Bound the WAL archive lag for the restore smoke.
      archive_timeout: "60s"
  storage:
    size: 5Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  affinity:
    # HA: spread instances, but `preferred` keeps the overlay schedulable on a
    # single-node cluster (the promote-test substrate).
    enablePodAntiAffinity: true
    podAntiAffinityType: preferred
    topologyKey: kubernetes.io/hostname
    nodeSelector:
      workload: database
    tolerations:
      - key: workload
        operator: Equal
        value: database
        effect: NoSchedule
