# zitadel-db dev — CloudNativePG Cluster (ADR-004, E1).
# Credentials are projected by the sibling ExternalSecret from
# `secret/zitadel-db/dev`; see `zitadel-db-credentials-dev.yaml`.
#
# Zitadel connects here with a DSN from the same Vault path. Database and owner
# are both `zitadel`, matching the chart's DSN contract.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: zitadel-db
  namespace: data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    # After the ObjectStore (wave 20) that holds the backup configuration.
    argocd.argoproj.io/sync-wave: "30"
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: zitadel-db-dev
  backup:
    target: prefer-standby
  bootstrap:
    initdb:
      database: zitadel
      owner: zitadel
      secret:
        name: zitadel-db-credentials
      dataChecksums: true
      encoding: UTF8
      localeCollate: C
      localeCType: C
  postgresql:
    parameters:
      # Bound the WAL archive lag for the restore smoke.
      archive_timeout: "60s"
  storage:
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  affinity:
    # Reduced-HA dev profile: one instance, no anti-affinity constraint.
    enablePodAntiAffinity: false
    nodeSelector:
      workload: database
    tolerations:
      - key: workload
        operator: Equal
        value: database
        effect: NoSchedule
