# EKS (cloud) values overlay for the service-template sandbox app.
# Selected by deploying with DEPLOY_ENV=eks (repo variable).
# Mirrors a service's env/prod overlay: HA-shaped, reserved for the cloud
# target. Never applied locally — apply steps are guarded by DEPLOY_ENV.
fullnameOverride: sca-sandbox-app

replicaCount: 3

image:
  repository: docker.io/nginxinc/nginx-unprivileged
  # Pinned tag, no floating/latest (repo image policy).
  tag: "1.27-alpine"
  pullPolicy: IfNotPresent

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: http

serviceMonitor:
  enabled: false

ingress:
  enabled: false

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

pdb:
  enabled: true
  minAvailable: 2
