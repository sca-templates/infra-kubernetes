# =============================================================================
# infra-kubernetes release-gate — no human PR merges while a release PR is open
# =============================================================================
# A release-please PR deliberately waits behind every other merge so that a doc
# or dependency change bundled in the same release is reflected in the tag and
# CHANGELOG. This check makes that ordering visible and enforced: any PR
# arriving while a release PR is open gets a failing gate and cannot merge. The
# release PR itself is exempted inside the shared template, so it is never
# blocked.
#
# Thin wrapper over the org shared template
# (CI-CD-Templates/.github/workflows/shared-qa-lock-check.yml, SHA-pinned);
# the shared gate job is named `release-gate`, so the required_status_checks
# context on `main` stays valid. Detection keys on the release-please PR title
# `chore(...release...)` rather than the reserved branch name.
#
# The reusable workflow is called unconditionally, and that is load-bearing.
# The required context is the *nested* check run `release-gate / release-gate`
# (caller job / callee job), which GitHub only creates if the reusable is
# actually invoked. An `if` on this job does not "skip the gate for bots": it
# skips the whole call, so the nested run is never created and the required
# context has no check run to wait for — every bot-authored PR (Dependabot,
# release-please) sits on `Expected — waiting for status to be reported`
# forever. A skipped *job* reports conclusion `skipped`; a job that never runs
# reports nothing at all, and nothing does not satisfy a required context.
#
# So bot PRs are gated like any other PR. They report the check immediately and
# pass, unless a release PR is actually open — a bounded wait, not a deadlock,
# because the gate goes green as soon as the release PR merges and Dependabot
# re-runs it on the next rebase. A true bot exemption needs the condition inside
# the callee, i.e. an input on the shared template, so the nested run is still
# reported as skipped; that is tracked in `sca-templates/CI-CD-Templates` and is
# deliberately not emulated here.
#
# `workflow_dispatch` keeps the gate manually verifiable.
#
# Registered as required_status_checks context 'release-gate / release-gate' on
# main by the `main-protected` ruleset.

name: release-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: release-gate
    uses: sca-templates/CI-CD-Templates/.github/workflows/shared-qa-lock-check.yml@e88eb3d2a1bfbfed3a1e6e4aa80b046fb31ed54d
