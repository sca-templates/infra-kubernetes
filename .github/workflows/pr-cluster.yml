# =============================================================================
# infra-kubernetes cluster smoke — validate the platform still works on a real
# Kubernetes API (Phase 1). Ran by bootstrap/smoke-ci.sh, which owns the
# boot/converge/run/diagnose/teardown cycle so each component only adds its
# smoke command (bootstrap/smoke-<component>.sh).
#
# Single substrate: Floci's emulated EKS (a real k3s node + ECR). The job boots
# the *full* platform through the real app-of-apps, seeds Vault, converges every
# catalog Application, then runs the touched components' smokes plus the EKS/ECR
# and cloud-integration smokes. The chart images are preloaded into the node
# (and cached between runs) so a throttled public registry is not on the
# critical path.
#
# Triggers:
#   - pull_request:       required PR check on main (branch protection must
#                         include `Smoke`); docs-only PRs are skipped by the
#                         component resolver below.
#   - workflow_dispatch:  manual one-off smoke of component(s)/ref for testing.
#
# Same-repo PRs only (coherent with main-sync.yml); fork PRs are skipped.
# =============================================================================

name: Cluster Smoke

on:
  pull_request:
  workflow_dispatch:
    inputs:
      component:
        description: Component(s) to smoke — subdir(s) of infrastructure/, comma-separated, or `cloud`/`eks`
        type: string
        default: cert-manager
      ref:
        description: Git ref/branch to smoke
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cluster-smoke:
    name: Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Fork PRs cannot resolve the head ref on the upstream repo (main-sync skips
    # forks too); only run the smoke for same-repo PRs.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Cache the pinned toolchain (~/.local/bin). The key hashes versions.sh,
      # so bumping a pin invalidates the cache; `make prereqs` stays idempotent
      # (a partial restore is completed, a full restore is a no-op).
      - name: Cache toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin
          key: ${{ runner.os }}-toolchain-${{ hashFiles('bootstrap/versions.sh') }}
          restore-keys: |
            ${{ runner.os }}-toolchain-

      - name: Install pinned toolchain
        run: |
          make prereqs >/dev/null
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      # Cache the chart images preloaded into the EKS node. Without it every run
      # pulls the whole catalog from public registries (Docker Hub/ghcr/quay),
      # which is slow and rate-limited (ECR Public answers 429 to shared IPs).
      # The key hashes the pins, the catalog manifests and the renderer, so a
      # version bump invalidates the tarball; a partial hit still helps.
      - name: Restore preloaded image cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sca/preload
          key: >-
            ${{ runner.os }}-preload-${{ hashFiles(
              'bootstrap/versions.sh',
              'argocd/apps-*.yaml',
              'argocd/kong-*.yaml',
              'envs/local/*.yaml',
              'infrastructure/*/values-base.yaml',
              'bootstrap/preload-chart-images.sh'
            ) }}
          restore-keys: |
            ${{ runner.os }}-preload-

      - name: Resolve smoke components and ref
        id: resolve
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual: smoke the requested component(s)/ref for testing.
            {
              echo "components=${{ inputs.component }}"
              echo "slug=$(printf '%s' "${{ inputs.component }}" | tr ',' '-')"
              echo "ref=${{ inputs.ref }}"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Selective: map every changed path to the touched component(s), so a
          # PR touching more than one component smokes all of them in one run.
          changed="$(git diff --name-only "${PR_BASE_SHA}...${PR_HEAD_SHA}")"
          comps=()
          add() {
            local c="$1" existing
            for existing in "${comps[@]}"; do
              [ "$existing" = "$c" ] && return 0
            done
            comps+=("$c")
          }

          # 1. infrastructure/<c>/... → <c>
          for c in infrastructure/*/; do
            [ -d "$c" ] || continue
            c="${c%/}"; c="${c##*/}"
            if printf '%s\n' "$changed" | grep -qE "(^|/)${c}(/|\.yaml$|\.yml$)"; then
              add "$c"
            fi
          done

          # 2. envs/<env>/<c>.yaml → <c>
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            add "$(printf '%s' "$f" | sed -E 's|^envs/[^/]+/([^/]+)\.ya?ml$|\1|')"
          done < <(printf '%s\n' "$changed" | grep -oE '^envs/[^/]+/[^/]+\.ya?ml$' || true)

          # 3. per-component smoke scripts: bootstrap/smoke-<c>*.sh → <c>
          #    (smoke-ci/smoke-target are the shared framework; smoke-cloud* → `cloud`).
          #    smoke-eks is exercised by the always-on EKS step, so map it to the
          #    framework default.
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            c="$(printf '%s' "$f" | sed -E 's|^bootstrap/smoke-||; s|\.sh$||; s|-aws$||')"
            case "$c" in
              ci|target) ;;
              cloud|cloud-*) add cloud ;;
              eks) add cert-manager ;;
              *) add "$c" ;;
            esac
          done < <(printf '%s\n' "$changed" | grep -oE '^bootstrap/smoke-[^/]*\.sh$' || true)

          # 4. cloud/EKS emulator tooling → `cloud` / framework default
          #    (self-validates in CI; eks tooling is exercised by the EKS step).
          if printf '%s\n' "$changed" | grep -qE '^bootstrap/cloud-emulator[^/]*\.sh$'; then
            add cloud
          fi
          if printf '%s\n' "$changed" | grep -qE '^bootstrap/eks-emulator[^/]*\.sh$'; then
            add cert-manager
          fi

          # 5. shared framework/tooling → default component (cert-manager): the
          #    smoke's own machinery (and the argocd manifest set / Makefile it
          #    drives) must be exercised by the smoke, not merged untested.
          framework_re='^(Makefile|argocd/|bootstrap/(smoke-ci|smoke-target|render-served-apps|sca|versions|local-git-|preload-chart-images|collect-argocd-diagnostics)[^/]*$)'
          if printf '%s\n' "$changed" | grep -qE "$framework_re"; then
            add cert-manager
          fi

          if [ "${#comps[@]}" -eq 0 ]; then
            echo "No platform component touched; skipping cluster smoke."
            echo "components=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          list="$(IFS=,; echo "${comps[*]}")"
          {
            echo "components=${list}"
            echo "slug=${list//,/-}"
            echo "ref=${PR_HEAD_REF}"
          } >> "${GITHUB_OUTPUT}"

      - name: Cluster smoke (full platform on the EKS substrate)
        if: steps.resolve.outputs.components != ''
        run: |
          export PATH="${HOME}/.local/bin:${PATH}"
          bootstrap/smoke-ci.sh "${SMOKE_COMPONENTS}" "${SMOKE_REF}"
        env:
          GIT_REPO_URL: https://github.com/${{ github.repository }}
          SMOKE_COMPONENTS: ${{ steps.resolve.outputs.components }}
          SMOKE_REF: ${{ steps.resolve.outputs.ref }}

      - name: Upload smoke diagnose artifacts
        if: always() && steps.resolve.outputs.components != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-diagnose-${{ steps.resolve.outputs.slug }}
          path: .generated/
          # `.generated/` is a dot-directory: without this the artifact is empty.
          include-hidden-files: true
          if-no-files-found: warn

      # smoke-ci.sh tears the substrate down in its EXIT trap; this step covers
      # cancellation, when the trap may not run.
      - name: Teardown EKS substrate
        if: always() && steps.resolve.outputs.components != ''
        run: make eks-down 2>/dev/null || true
