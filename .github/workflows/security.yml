# =============================================================================
# infra-kubernetes security checks — secrets, IaC posture, image/version guards
#
# gitleaks, osv-scanner and checkov run through the org shared template
# (CI-CD-Templates/.github/workflows/shared-security-scan.yml, SHA-pinned); the
# checkov IaC baseline, the framework (kubernetes) and the hash-pinned
# requirements file all use the template defaults. Only the image/version pin
# guards have no template counterpart and stay local.
# =============================================================================

name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    name: Security
    permissions:
      contents: read
      security-events: write # gitleaks SARIF upload to code scanning
    uses: sca-templates/CI-CD-Templates/.github/workflows/shared-security-scan.yml@684819efa838ed7f653723f9f58ed18c48697b37
    with:
      gitleaks: true
      osv-scan: true
      iac: true

  guards:
    name: Guard policies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject floating image tags
        run: |
          set -euo pipefail
          fail=0
          # `bootstrap` carries the smoke framework, script-inline manifests and
          # bootstrap/versions.sh (the image-pin SSOT), so it is held to the
          # same rules as the rendered charts.
          if grep -rnE 'image:[[:space:]]*[^[:space:]#]+:[[:space:]]*latest' infrastructure charts argocd bootstrap; then
            echo "ERROR: 'image: <name>:latest' violates the pinned-tags policy" >&2
            fail=1
          fi
          if grep -rInE 'tag:[[:space:]]+(latest|nightly|edge)' infrastructure charts bootstrap; then
            echo "ERROR: floating tag detected" >&2
            fail=1
          fi
          if grep -rnE 'targetRevision:[[:space:]]+(latest|edge)' argocd; then
            echo "ERROR: floating chart targetRevision detected" >&2
            fail=1
          fi
          # Shell side of the same policy: a `:latest` / `:nightly` / `:edge`
          # reference on a non-comment line (docker run, image pin defaults).
          if grep -rnE '^[[:space:]]*[^#].*:(latest|nightly|edge)(["'\'']|[[:space:]]|$)' bootstrap; then
            echo "ERROR: floating image tag in bootstrap (pin a version in bootstrap/versions.sh)" >&2
            fail=1
          fi
          exit ${fail}
