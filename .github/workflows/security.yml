# =============================================================================
# infra-kubernetes security checks — secrets, IaC posture, image/version guards
#
# gitleaks + osv-scanner run through the org shared template
# (CI-CD-Templates/.github/workflows/shared-security-scan.yml, SHA-pinned to
# the v3.0.0 release; gitleaks + osv only). checkov (IaC baseline) and the pin
# guards have no template counterpart and stay local.
# =============================================================================

name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    name: Security
    permissions:
      contents: read
      security-events: write # gitleaks SARIF upload to code scanning
    uses: sca-templates/CI-CD-Templates/.github/workflows/shared-security-scan.yml@0228c2950c0d269dcf22f64415ea941b5da13102
    with:
      gitleaks: true
      osv-scan: true

  iac:
    name: IaC (checkov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Install checkov (pinned, verified)
        run: python -m pip install --disable-pip-version-check --require-hashes -r .github/requirements.txt
      - name: Checkov scan
        # The baseline gates new IaC findings (Phase 1 onward): the entries in
        # .github/checkov-baseline.json are documented, intentional manifests
        # (e.g. the local-only git server pod); anything not in the baseline
        # fails the PR. Re-derive the baseline only with review — see
        # docs/security.md.
        run: |
          checkov -d . --framework kubernetes \
            --download-external-modules false \
            --quiet --compact \
            --baseline .github/checkov-baseline.json

  guards:
    name: Guard policies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject floating image tags
        run: |
          set -euo pipefail
          fail=0
          if grep -rnE 'image:[[:space:]]*[^[:space:]#]+:[[:space:]]*latest' infrastructure charts argocd; then
            echo "ERROR: 'image: <name>:latest' violates the pinned-tags policy" >&2
            fail=1
          fi
          if grep -rInE 'tag:[[:space:]]+(latest|nightly|edge)' infrastructure charts; then
            echo "ERROR: floating tag detected" >&2
            fail=1
          fi
          if grep -rnE 'targetRevision:[[:space:]]+(latest|edge)' argocd; then
            echo "ERROR: floating chart targetRevision detected" >&2
            fail=1
          fi
          exit ${fail}
