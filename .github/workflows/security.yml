# =============================================================================
# infra-kubernetes security checks — secrets, IaC posture, image/version guards
# =============================================================================

name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, verified)
        run: |
          GITLEAKS_VERSION="v8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          printf '%s  %s\n' "${GITLEAKS_SHA256}" /tmp/gitleaks.tar.gz | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Gitleaks scan
        run: |
          gitleaks detect --source . --report-format sarif \
            --report-path gitleaks-report.sarif --redact
      - name: Upload SARIF
        # Fork PRs cannot write security-events; scan still runs and fails the
        # PR on a leak, it just does not surface a code-scanning alert.
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: gitleaks-report.sarif

  iac:
    name: IaC (checkov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"
      - name: Install checkov (pinned)
        run: python -m pip install --disable-pip-version-check checkov==3.3.15
      - name: Checkov scan
        # Phase 0 ships no IaC and no baseline; the baseline gates findings
        # once infrastructure/ lands (Phase 1 onward).
        run: |
          checkov -d . --framework kubernetes \
            --download-external-modules false \
            --quiet --compact

  guards:
    name: Guard policies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Reject floating image tags
        run: |
          set -euo pipefail
          fail=0
          if grep -rnE 'image:[[:space:]]*[^[:space:]#]+:[[:space:]]*latest' infrastructure charts argocd; then
            echo "ERROR: 'image: <name>:latest' violates the pinned-tags policy" >&2
            fail=1
          fi
          if grep -rInE 'tag:[[:space:]]+(latest|nightly|edge)' infrastructure charts; then
            echo "ERROR: floating tag detected" >&2
            fail=1
          fi
          if grep -rnE 'targetRevision:[[:space:]]+(latest|edge)' argocd; then
            echo "ERROR: floating chart targetRevision detected" >&2
            fail=1
          fi
          exit ${fail}
