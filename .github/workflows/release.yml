# =============================================================================
# infra-kubernetes release — GitHub Releases + CHANGELOG + signed tags
# =============================================================================
#
# Thin wrapper over the org shared template
# (CI-CD-Templates/.github/workflows/shared-release-flow.yml, SHA-pinned):
# release-please (conventional commits) opens a release PR for `feat`/`fix`
# commits that reach the deployed platform, and on merge creates the tag and
# GitHub Release; the shared `sign-tag` job re-signs the tag with the
# dedicated release-bot GPG key (replacing the API-created lightweight ref
# with an annotated, signed one at the same commit). Commits are
# path-scoped via .release-please-config.json exactly as before.
#
# A dedicated installation token is required: resources opened via the default
# GITHUB_TOKEN do not trigger workflow runs, so the release PR would never run
# the required Validate/Security checks and could not be merged. The token is
# minted per run inside the shared flow from the org-owned `sca-bot-release`
# GitHub App (APP_ID + APP_PRIVATE_KEY), scoped to this repository. See
# docs/versioning.md and docs/secrets.md.
#
# A manual `workflow_dispatch` (tag re-sign) is no longer supported here; the
# shared template covers only the push path. See docs/versioning.md.

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release flow
    uses: sca-templates/CI-CD-Templates/.github/workflows/shared-release-flow.yml@d68a710f413fd4c8134e53da06778c5e190cbfbf
    with:
      release-type: simple
      config-file: .release-please-config.json
      manifest-file: .release-please-manifest.json
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
