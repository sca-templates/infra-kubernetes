# =============================================================================
# infra-kubernetes release — GitHub Releases + CHANGELOG + signed tags
# =============================================================================
#
# Thin wrapper over the org shared template
# (CI-CD-Templates/.github/workflows/shared-release-flow.yml, SHA-pinned):
# release-please (conventional commits) opens a release PR for `feat`/`fix`
# commits that reach the deployed platform, and on merge creates the tag and
# GitHub Release; the shared `sign-tag` job re-signs the tag with the
# dedicated release-bot GPG key (replacing the API-created lightweight ref
# with an annotated, signed one at the same commit). Commits are
# path-scoped via .release-please-config.json exactly as before.
#
# A dedicated installation token is required: resources opened via the default
# GITHUB_TOKEN do not trigger workflow runs, so the release PR would never run
# the required Validate/Security checks and could not be merged. The token is
# minted per run inside the shared flow from the org-owned `sca-bot-release`
# GitHub App (APP_ID + APP_PRIVATE_KEY), scoped to this repository. See
# docs/versioning.md and docs/secrets.md.
#
# `latest-policy: hold` keeps `latest` off the release this run cuts. The
# template publishes the release and re-asserts the previous `latest` pointer,
# so `Release promote` (release-publish.yml) stays the only thing that ever
# moves the pointer forward, on a human go/no-go — the rule docs/versioning.md
# states. The capture/finalize logic that used to live here now ships inside
# the shared template's `hold` policy; the accepted deviation (the pointer
# rests on the newest release for a few seconds, because the shared `sign-tag`
# job force-pushes the tag and that rewrite publishes the release) is
# documented there.
#
# A manual `workflow_dispatch` (tag re-sign) is not supported here; the shared
# template covers only the push path. See docs/versioning.md.

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release flow
    permissions:
      contents: read
      pull-requests: write # the shared auto-merge job needs it (required by the template)
    uses: sca-templates/CI-CD-Templates/.github/workflows/shared-release-flow.yml@684819efa838ed7f653723f9f58ed18c48697b37
    with:
      release-type: simple
      config-file: .release-please-config.json
      manifest-file: .release-please-manifest.json
      latest-policy: hold
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
