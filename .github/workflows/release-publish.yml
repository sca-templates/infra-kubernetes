# =============================================================================
# infra-kubernetes release promotion — claim `latest` for an adopted release
# =============================================================================
# The tag is the artifact; the release entry is the announcement. And the
# `latest` designation is a separate, human decision from both.
#
# This workflow is that decision, and the only thing in the repository that ever
# moves `latest` **forward** (release.yml's `finalize` only re-states it on an
# older release). It mirrors the rule service releases already follow — a semver
# tag is cut on merge and marked `latest` only once prod adopted it (see
# docs/architecture.md, services row).
#
# Why a bot is needed at all: release-please cannot express "publish without
# claiming latest". It calls `repos.createRelease` with only `draft`,
# `prerelease` and `target_commitish` (release-please `src/github-api.ts`),
# while GitHub's `make_latest` **defaults to `true` for newly published
# releases**. So a full release published by the automation always takes the
# pointer. `gh release edit --latest` is the only lever, and that is a bot step.
#
# Why the release is already public when this runs: it is not a draft. The
# `finalize` job in release.yml publishes it right after the shared flow signs
# the tag, so the state on arrival is a full release *held off* latest. (It was
# meant to be a draft, but the shared `sign-tag` job replaces the API-created
# lightweight tag with a signed annotated one via `git push -f refs/tags/<TAG>`,
# and that rewrite publishes the draft — see release.yml and docs/versioning.md.)
#
# The pointer it moves is an explicit server-side designation, not a by-date
# fallback, and it is deliberately parked on an *older* release: `finalize`
# re-asserts the previous tag on every release and verifies the result, because
# `make_latest=false` alone stores nothing and `GET /releases/latest` would fall
# back to the newest published release — the one that was just cut. Promoting is
# what moves it forward, and this workflow is the only thing that does.
#
# Guard rails, in order: the tag exists, it is annotated, its signature verifies
# against the committed trust anchor (.github/release-bot-gpg.pub, the same key
# the sign-tag job uses), the release is published, it is not a pre-release, and
# it is not older than the release currently holding `latest` — that last one
# enforces the "forward only" claim above, and it matters *because* `finalize`
# parks the pointer on an older release, so an old tag is the everyday input.
# The token is minted from the org-owned `sca-bot-release` GitHub App — the identity
# release-please authors with (see docs/secrets.md). Unlike `release.yml`, this
# workflow is local: the shared template covers only the push path, and a manual
# promotion is exactly what it does not model.
#
# Re-running is a no-op once the tag already holds the pointer, so a promotion
# that half-failed can simply be re-dispatched.
# =============================================================================

name: Release promote

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to mark as latest, e.g. v0.10.0 (no refs/tags/ prefix)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-promote-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote to latest
    runs-on: ubuntu-latest
    steps:
      - name: Mint release-bot token
        id: app-token
        uses: sca-templates/CI-CD-Templates/.github/actions/mint-app-token@fdb0c1fe35fcf704257dc9f61d34ba497370454a
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Verify the release-bot signature on the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "${TAG}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'${TAG}' is not a vX.Y.Z release tag"; exit 1 ;;
          esac
          git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null \
            || { echo "::error::tag '${TAG}' does not exist"; exit 1; }
          test "$(git cat-file -t "${TAG}")" = tag \
            || { echo "::error::'${TAG}' is not an annotated tag; the sign-tag job did not run"; exit 1; }
          gpg --batch --import .github/release-bot-gpg.pub
          git tag -v "${TAG}" \
            || { echo "::error::'${TAG}' is not signed by the release bot; refusing to promote"; exit 1; }

      - name: Check the release is ready to be promoted
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # `gh release view` has no isLatest field; it is only on `release list`.
          RELEASES="$(gh release list --limit 100 --json tagName,isDraft,isPrerelease,isLatest)"
          TARGET="$(printf '%s' "$RELEASES" | jq -c --arg tag "$TAG" 'map(select(.tagName == $tag)) | .[0] // empty')"
          if [ -z "$TARGET" ]; then
            echo "::error::no release entry for '${TAG}'; a tag alone is not promotable"
            exit 1
          fi
          if [ "$(printf '%s' "$TARGET" | jq -r '.isDraft')" = "true" ]; then
            echo "::error::'${TAG}' is still a draft; the finalize job in release.yml has not published it yet"
            exit 1
          fi
          if [ "$(printf '%s' "$TARGET" | jq -r '.isPrerelease')" = "true" ]; then
            echo "::error::'${TAG}' is a pre-release and cannot be the latest release"
            exit 1
          fi
          if [ "$(printf '%s' "$TARGET" | jq -r '.isLatest')" = "true" ]; then
            echo "::notice::'${TAG}' already holds latest; nothing to do"
            exit 0
          fi
          CURRENT="$(printf '%s' "$RELEASES" | jq -r '.[] | select(.isLatest == true) | .tagName' | head -n1)"
          # Ordering guard. `finalize` parks the pointer on the *previous*
          # release, so an older tag is the normal input here — and promoting it
          # would move `latest` backwards in silence, which is the one outcome
          # this workflow exists to prevent.
          #
          # `sort -V`, never a string compare. Lexicographically
          # "0.9.0" > "0.10.1", so a "reject if older" test written with `<`
          # would *accept* v0.9.0 while v0.10.1 holds latest — the exact
          # regression, on the two-digit-minor case that matters most. Tags are
          # plain vX.Y.Z, so version order is the intended order.
          #
          # No CURRENT means nobody holds the pointer (first release, or it was
          # cleared), and there is nothing to regress to.
          if [ -n "$CURRENT" ]; then
            OLDEST="$(printf '%s\n%s\n' "${CURRENT#v}" "${TAG#v}" | sort -V | head -n1)"
            if [ "$OLDEST" = "${TAG#v}" ]; then
              echo "::error::'${TAG}' is older than the current latest (${CURRENT}); refusing to move latest backwards"
              exit 1
            fi
          fi
          echo "::notice::promoting ${TAG} (currently latest: ${CURRENT:-none})"

      - name: Move the latest pointer
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh release edit "${TAG}" --latest
          echo "::notice::${TAG} is now the latest release"
