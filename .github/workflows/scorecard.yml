# =============================================================================
# OpenSSF Scorecard — supply-chain security score, results published to OSSF
# and uploaded as code-scanning SARIF.
#
# Thin wrapper over the org shared template
# (CI-CD-Templates/.github/workflows/shared-scorecard.yml), pinned to a SHA.
# =============================================================================

name: Scorecards supply-chain security

on:
  workflow_dispatch:
  schedule:
    - cron: "13 8 * * 1" # Mondays 08:13 Bogotá
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecards analysis
    permissions:
      actions: read # repository contents stats
      contents: read
      security-events: write # upload SARIF to code scanning
      id-token: write # publish_results needs an OIDC token
    uses: sca-templates/CI-CD-Templates/.github/workflows/shared-scorecard.yml@d68a710f413fd4c8134e53da06778c5e190cbfbf
    with:
      publish-results: true
