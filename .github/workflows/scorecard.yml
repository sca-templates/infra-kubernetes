# =============================================================================
# OpenSSF Scorecard — supply-chain security score, results published to OSSF
# and uploaded as code-scanning SARIF.
# =============================================================================

name: Scorecards supply-chain security

on:
  workflow_dispatch:
  schedule:
    - cron: "13 8 * * 1" # Mondays 08:13 Bogotá
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecards analysis
    runs-on: ubuntu-latest
    permissions:
      id-token: write # publish_results needs an OIDC token
      contents: read # repository contents
      security-events: write # upload SARIF to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Scorecards
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          repo_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload results as SARIF
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: results.sarif
