# =============================================================================
# infra-kubernetes validation — pull requests and pushes to main
#
# Repository-hygiene checks (markdown, YAML + shell syntax, actionlint) run
# through the org shared template
# (CI-CD-Templates/.github/workflows/shared-validate.yml, SHA-pinned); the
# Markdown link config, the yamllint config, the hash-pinned yamllint
# requirements and the shell glob all match the template defaults. Kubernetes
# and Helm manifest validation is specific to this repo and stays in the local
# `kubernetes` job.
#
# No top-level `concurrency` group: the shared template declares its own, and a
# caller reusing the same group makes the call fail at dispatch with zero jobs.
# =============================================================================

name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shared:
    name: Validate
    uses: sca-templates/CI-CD-Templates/.github/workflows/shared-validate.yml@684819efa838ed7f653723f9f58ed18c48697b37
    with:
      markdown: true
      markdown-link-config: .github/markdown-link-check.json
      markdown-link-paths: "README.md docs .github"
      yaml: true
      yaml-config: .yamllint.yaml
      yaml-requirements: .github/requirements-yamllint.txt
      shell-glob: bootstrap/*.sh
      actionlint: true

  kubernetes:
    name: Kubernetes and Helm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - name: Install kubeconform (pinned, verified)
        run: |
          KUBECONFORM_VERSION="v0.8.0"
          KUBECONFORM_SHA256="9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            -o /tmp/kubeconform.tar.gz
          printf '%s  %s\n' "${KUBECONFORM_SHA256}" /tmp/kubeconform.tar.gz | sha256sum -c -
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
      - name: Validate static manifests
        run: |
          set -euo pipefail
          if ls infrastructure/*/manifests/*.yaml infrastructure/*/shared/*.yaml >/dev/null 2>&1; then
            kubeconform -strict -ignore-missing-schemas \
              infrastructure/*/manifests/*.yaml infrastructure/*/shared/*.yaml
          else
            echo "No infrastructure/ manifests yet; activates with Phase 1."
          fi
      - name: Validate rendered service template
        run: |
          set -euo pipefail
          mkdir -p .generated
          helm template service-template charts/service-template \
            --values charts/service-template/values.yaml > .generated/service-template.yaml
          kubeconform -strict -ignore-missing-schemas .generated/service-template.yaml
      - name: Helm lint service template when present
        run: |
          if [ -d charts/service-template ]; then
            helm lint charts/service-template
          else
            echo "No service template yet; helm lint activates with Phase 6."
          fi
      - name: Install kube-linter (pinned, verified)
        run: |
          KUBELINTER_VERSION="v0.8.3"
          KUBELINTER_SHA256="1a6d8419b11971372971fdbc22682b684ebfb7cf1c39591662d1b6ca736c41df"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://github.com/stackrox/kube-linter/releases/download/${KUBELINTER_VERSION}/kube-linter-linux.tar.gz" \
            -o /tmp/kube-linter.tar.gz
          printf '%s  %s\n' "${KUBELINTER_SHA256}" /tmp/kube-linter.tar.gz | sha256sum -c -
          tar -xzf /tmp/kube-linter.tar.gz -C /tmp kube-linter
          sudo install -m 0755 /tmp/kube-linter /usr/local/bin/kube-linter
          kube-linter version
      - name: kube-linter rendered service template
        run: |
          set -euo pipefail
          if [ -d charts/service-template ]; then
            kube-linter lint .generated/service-template.yaml
          else
            echo "No service template yet; kube-linter activates with Phase 6."
          fi
      - name: kube-linter infrastructure manifests when present
        run: |
          set -euo pipefail
          if ls infrastructure/*/manifests/*.yaml infrastructure/*/shared/*.yaml >/dev/null 2>&1; then
            kube-linter lint infrastructure/*/manifests/*.yaml infrastructure/*/shared/*.yaml
          else
            echo "No infrastructure/ manifests yet; activates with Phase 1."
          fi
