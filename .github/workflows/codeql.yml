# =============================================================================
# CodeQL — static analysis of GitHub Actions workflow files (the only code in
# this repo); alerts land in the Security tab.
#
# Thin wrapper over the org shared template
# (CI-CD-Templates/.github/workflows/shared-codeql.yml), pinned to a SHA.
# =============================================================================

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "13 8 * * 1" # Mondays 08:13 Bogotá

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL
    permissions:
      actions: read # fetch the CodeQL bundle
      contents: read
      security-events: write # upload SARIF to code scanning
    uses: sca-templates/CI-CD-Templates/.github/workflows/shared-codeql.yml@0228c2950c0d269dcf22f64415ea941b5da13102
    with:
      languages: '["actions"]'
