# Services registry for dev — one generated Application per service.
# Each service owns its manifests in its own repo (deploy/), see
# docs/onboarding-new-service.md. ArgoCD tracks `main` of the service repo:
# the service's `promote` workflow selects the branch to deploy and syncs this
# Application through the ArgoCD API (scoped token) — no refs, last wins.
# Sync is intentionally NOT automated: it is driven by the promote workflow.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: services-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - list:
        # Add one element per service. Example:
        # - name: nest-authz
        #   namespace: nest-authz
        #   appRepo: https://github.com/sca-templates/nest-authz
        #   wave: "60"
        elements: []
  template:
    metadata:
      name: '{{.name}}-dev'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: '{{.wave}}'
    spec:
      project: default
      source:
        repoURL: '{{.appRepo}}'
        targetRevision: main
        path: deploy
        helm:
          releaseName: '{{.name}}'
          valueFiles:
            - env/dev.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.namespace}}'
      syncOptions:
        - CreateNamespace=true
        - ApplyOutOfSyncOnly=true
        - ServerSideApply=true
