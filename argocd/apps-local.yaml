apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-local
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - list:
        elements: []
  template:
    metadata:
      name: '{{.name}}-local'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: '{{.wave}}'
    spec:
      project: default
      sources:
        - repoURL: '{{.chartRepo}}'
          chart: '{{.chart}}'
          targetRevision: '{{.targetRevision}}'
          helm:
            releaseName: '{{.name}}'
            valueFiles:
              - '$values/infrastructure/{{.name}}/values-base.yaml'
              - '$values/envs/local/{{.name}}.yaml'
        - repoURL: "{{GIT_REPO_URL}}"
          targetRevision: main
          ref: values
        - repoURL: "{{GIT_REPO_URL}}"
          targetRevision: main
          path: infrastructure/{{.path}}
          directory:
            recurse: true
      ignoreDifferences:
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jqPathExpressions:
            - .spec.versions[].schema
            - .status
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true