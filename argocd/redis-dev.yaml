# redis-dev — RedisReplication, DEDICATED Application.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "40"
spec:
  project: default
  source:
    repoURL: "{{GIT_REPO_URL}}"
    targetRevision: "{{GIT_TARGET_BRANCH}}"
    path: infrastructure/redis/manifests
    directory:
      recurse: true
      include: "*-dev.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
