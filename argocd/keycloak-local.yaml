# keycloak-local — OIDC identity provider, DEDICATED Application.
#
# Multi-source: the codecentric/keycloakx chart + `$values` ref (base + env
# overlay) + the per-env ExternalSecrets + the shared realm/Certificate. It is
# not in the platform ApplicationSet because it is both a Helm release and the
# owner of raw realm/TLS/secret manifests.
#
# Wave 50: after the datastores (postgres-app/keycloak-db at 40), Vault/ESO and
# Kong (20). The realm and TLS resources are applied at -10 within the app so
# the StatefulSet starts with its secrets, certificate and import file ready.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-local
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "50"
spec:
  project: default
  sources:
    - repoURL: https://codecentric.github.io/helm-charts
      chart: keycloakx
      targetRevision: 7.4.0
      helm:
        releaseName: keycloak
        valueFiles:
          - $values/infrastructure/keycloak/values-base.yaml
          - $values/envs/local/keycloak.yaml
    - repoURL: "{{GIT_REPO_URL}}"
      targetRevision: "{{GIT_TARGET_BRANCH}}"
      ref: values
    - repoURL: "{{GIT_REPO_URL}}"
      targetRevision: "{{GIT_TARGET_BRANCH}}"
      path: infrastructure/keycloak/manifests
      directory:
        recurse: true
        include: "*-local.yaml"
    - repoURL: "{{GIT_REPO_URL}}"
      targetRevision: "{{GIT_TARGET_BRANCH}}"
      path: infrastructure/keycloak/shared
      directory:
        recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
