# postgres-app-prod — application + Zitadel databases, DEDICATED Application.
#
# `postgres-app` and `zitadel-db` are raw CloudNativePG `Cluster` CRs, so they
# cannot go through the platform ApplicationSet (which renders Helm charts).
# They ship in every environment through this per-env Application, at wave 40:
# after CloudNativePG (-10), the Barman Cloud plugin (10) and the Vault/ESO
# chain. Inside the Application: credentials (10), ObjectStores (20), Clusters
# (30) and ScheduledBackups (40).
#
# The manifests live in per-environment files under
# `infrastructure/postgres-app/manifests/`; `directory.include` selects only the
# files for this environment (the directory is shared by all four).
#
# prod is synced manually (no automated block), per ADR-003.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres-app-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "40"
spec:
  project: default
  source:
    repoURL: "{{GIT_REPO_URL}}"
    targetRevision: "{{GIT_TARGET_BRANCH}}"
    path: infrastructure/postgres-app/manifests
    directory:
      recurse: true
      include: "*-prod.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
