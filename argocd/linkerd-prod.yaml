# linkerd-local — Linkerd control plane, DEDICATED Application (not via the
# platform ApplicationSet; see docs/architecture.md#deviations-log).
#
# The plan originally called for deploying Linkerd with the `linkerd install`
# script (like the old infra-kubernetes). The CI cluster smoke discovers the
# catalog from `infrastructure/*/` and requires every entry to be an ArgoCD
# Application `<name>-<env>` that converges (bootstrap/smoke-ci.sh), so the
# script model cannot be validated. This Application installs the
# `linkerd-control-plane` chart as a normal catalog entry instead, following the
# same dedicated-Application pattern as Kong: multi-source (upstream chart +
# `$values` ref + the repo's own manifests path), the standard CRD
# `ignoreDifferences`, and auto-sync + prune (local tier). The chart pin lives
# here; the values live under infrastructure/linkerd/ + envs/local/.
#
# Sync-wave 30: after cert-manager (-20, the `sca-ca`/CA Issuer) and
# linkerd-crds (-10, the mesh CRDs it builds on); before the datastores (40) that
# opt into injection.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: linkerd-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  project: default
  sources:
    - repoURL: https://helm.linkerd.io/stable
      chart: linkerd-control-plane
      targetRevision: 1.16.11
      helm:
        releaseName: linkerd
        valueFiles:
          - $values/infrastructure/linkerd/values-base.yaml
          - $values/envs/prod/linkerd.yaml
    - repoURL: "{{GIT_REPO_URL}}"
      targetRevision: "{{GIT_TARGET_BRANCH}}"
      ref: values
    - repoURL: "{{GIT_REPO_URL}}"
      targetRevision: "{{GIT_TARGET_BRANCH}}"
      path: infrastructure/linkerd/manifests
      directory:
        recurse: true
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .spec.versions[].schema
        - .status
        - .spec.conversion
        - .spec.names.listKind
        - .spec.preserveUnknownFields
    # The control plane's webhook certificates are generated by Helm
    # (`genSelfSignedCert`) with no `lookup`, so the CA/keypair Secrets and the
    # webhook `caBundle` differ on every render. Ignore those fields so the
    # Application converges to Synced (the live bundle is created once on first
    # sync and is self-consistent). Same approach as Kong's admission webhook.
    - kind: Secret
      name: linkerd-proxy-injector-k8s-tls
      jqPathExpressions:
        - .data
    - kind: Secret
      name: linkerd-sp-validator-k8s-tls
      jqPathExpressions:
        - .data
    - kind: Secret
      name: linkerd-policy-validator-k8s-tls
      jqPathExpressions:
        - .data
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: linkerd-proxy-injector-webhook-config
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: linkerd-sp-validator-webhook-config
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: linkerd-policy-validator-webhook-config
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
  destination:
    server: https://kubernetes.default.svc
    namespace: linkerd
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
